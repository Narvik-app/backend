changelog:
  exclude:
    - labels:
        - ignore-for-release
  categories:
    - title: '🚀 Features'
      labels:
        - 'feature'
        - 'feat'
    - title: '🐛 Bug Fixes'
      labels:
        - 'fix'
        - 'bug'
    - title: '📝 Documentation'
      labels:
        - 'docs'
        - 'documentation'
    - title: '🎨 Style'
      labels:
        - 'style'
    - title: '♻️ Refactoring'
      labels:
        - 'refactor'
    - title: '⚡️ Performance'
      labels:
        - 'perf'
        - 'performance'
    - title: '✅ Tests'
      labels:
        - 'test'
        - 'tests'
    - title: '👷 CI'
      labels:
        - 'ci'
    - title: '🔧 Maintenance'
      labels:
        - 'build'
        - 'chore'
    - title: '📦 Dependencies'
      labels:
        - 'dependencies'
    - title: 'Other Changes'
      labels:
        - '*'
