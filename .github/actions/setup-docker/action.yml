name: 'Setup Docker Environment'
description: 'Builds/loads Docker images and optionally starts the services.'

inputs:
  build-only:
    description: 'If true, only build images and populate the cache. If false, load images and start services.'
    required: false
    default: 'false'

runs:
    using: "composite"
    steps:
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

        - name: Build images and populate cache
          if: inputs.build-only == 'true'
          uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
          with:
            files: |
              compose.yaml
              .github/compose.ci.yaml
            pull: true
            load: true
            set: |
              *.cache-from=type=gha,scope=${{ github.ref }}
              *.cache-from=type=gha,scope=refs/heads/main
              *.cache-to=type=gha,scope=${{ github.ref }},mode=max

        - name: Load images from cache
          if: inputs.build-only == 'false'
          uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
          with:
            files: |
              compose.yaml
              .github/compose.ci.yaml
            pull: true
            load: true
            set: |
              *.cache-from=type=gha,scope=${{ github.ref }}
              *.cache-from=type=gha,scope=refs/heads/main

        - name: Start services
          if: inputs.build-only == 'false'
          shell: bash
          run: docker compose -f compose.yaml -f .github/compose.ci.yaml up --wait --no-build

        - name: Show container logs on startup failure
          if: failure() && inputs.build-only == 'false'
          shell: bash
          run: |
            docker compose -f compose.yaml -f .github/compose.ci.yaml ps --all
            docker compose -f compose.yaml -f .github/compose.ci.yaml logs --no-color --timestamps
