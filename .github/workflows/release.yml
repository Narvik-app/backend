name: Release

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    # Only run on a release or pre-release
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update composer.json
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUMBER=${VERSION#v}
          jq --indent 4 --arg ver "$VERSION_NUMBER" '.version = $ver' composer.json > composer.json.tmp && mv composer.json.tmp composer.json

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "ci: Bump version to ${{ github.ref_name }}"
          branch: main
          file_pattern: composer.json

      - name: Upload composer.json for build job
        uses: actions/upload-artifact@v6
        with:
          name: composer-json
          path: composer.json

  build-and-push:
    runs-on: ubuntu-latest
    needs: update-version
    if: success() || needs.update-version.result == 'skipped'
    # This job depends on the update-version job.
    # On a push to main, update-version is skipped, but this job will still run.
    # On a release, this job waits for update-version to succeed.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download composer.json
        if: github.event_name == 'release'
        uses: actions/download-artifact@v7
        with:
          name: composer-json
          path: .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/narvik-back
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=dev,enable=${{ github.ref_name == github.event.repository.default_branch || github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=ref,event=branch,pattern=^([0-9]+\.[0-9]+.*)$,group=1,prefix=dev-,enable=${{ github.ref_name != github.event.repository.default_branch }}

      - name: Build and push Docker image (multi-platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.vendor=Benoit VIGNAL
            org.opencontainers.image.url=https://about.narvik.app

  # Alternative build using Buildah for Podman/containerd compatibility
  build-and-push-buildah:
    runs-on: ubuntu-latest
    needs: update-version
    if: (success() || needs.update-version.result == 'skipped') && vars.USE_BUILDAH == 'true'
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download composer.json
        if: github.event_name == 'release'
        uses: actions/download-artifact@v7
        with:
          name: composer-json
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Extract metadata for container image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/narvik-back
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=dev,enable=${{ github.ref_name == github.event.repository.default_branch || github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=ref,event=branch,pattern=^([0-9]+\.[0-9]+.*)$,group=1,prefix=dev-,enable=${{ github.ref_name != github.event.repository.default_branch }}

      - name: Build container image with Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/narvik-back
          tags: ${{ steps.meta.outputs.tags }}
          containerfiles: |
            ./Containerfile
          build-args: |
            APP_ENV=prod
          archs: ${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          target: frankenphp_prod
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.vendor=Benoit VIGNAL
            org.opencontainers.image.url=https://about.narvik.app

      - name: Push to Docker Hub
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # Create and push multi-arch manifest for Buildah builds
  create-buildah-manifest:
    runs-on: ubuntu-latest
    needs: build-and-push-buildah
    if: (success() || needs.update-version.result == 'skipped') && vars.USE_BUILDAH == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract metadata for container image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/narvik-back
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=dev,enable=${{ github.ref_name == github.event.repository.default_branch || github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=ref,event=branch,pattern=^([0-9]+\.[0-9]+.*)$,group=1,prefix=dev-,enable=${{ github.ref_name != github.event.repository.default_branch }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          # For each tag, create a manifest that includes both architectures
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker manifest create $tag \
              --amend ${tag}-amd64 \
              --amend ${tag}-arm64 || true
            docker manifest push $tag || true
          done
