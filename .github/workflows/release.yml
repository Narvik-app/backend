name: Release

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/narvik-back
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
      -
        name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    if: github.event_name == 'release'
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update composer.json
        run: |
          # Get version from tag, removing 'v' prefix if it exists
          VERSION=${{ github.ref_name }}
          VERSION_NUMBER=${VERSION#v}
          jq --arg ver "$VERSION_NUMBER" '.version = $ver' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "ci: Bump version to ${{ github.ref_name }}"
