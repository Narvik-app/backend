name: Labeler

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: bcoe/conventional-release-labels@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignored_types: '[]'
