name: CI

env:
  IGNORE_MIGRATION: false
  OAUTH_PASSPHRASE: changeme

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker images and populate cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Docker Environment
        uses: ./.github/actions/setup-docker
        with:
          build-only: true

  tests:
    needs: build
    permissions:
      contents: read # Allows checkout action to read your repository
      pull-requests: write # Allows the action to post comments on PRs
      statuses: write # Used by Codecov status updates
    name: Tests
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      - name: Setup Docker Environment
        uses: ./.github/actions/setup-docker
      -
        name: Create test database
        run: |
          docker compose exec -T php bin/console -e test doctrine:database:create
          # One DB per paratest worker (config/packages/doctrine.yaml suffixes by TEST_TOKEN).
          # Must match the worker count computed in composer.json's "test"/"ci-test" scripts.
          p=$(( $(docker compose exec -T php nproc) - 2 ))
          [ "$p" -ge 1 ] || p=1
          for i in $(seq 1 "$p"); do
            docker compose exec -T -e TEST_TOKEN=$i php bin/console -e test doctrine:database:create
          done
      -
        name: Run migrations
        run: |
          docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
          p=$(( $(docker compose exec -T php nproc) - 2 ))
          [ "$p" -ge 1 ] || p=1
          for i in $(seq 1 "$p"); do
            docker compose exec -T -e TEST_TOKEN=$i php bin/console -e test doctrine:migrations:migrate --no-interaction
          done

      -
        name: Create JWT keys
        run: docker compose exec -T php bin/console -e test install:oauth
      -
        name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      -
        name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://localhost
      -
        name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      -
        name: Run PHPUnit
        id: phpunit
        run: |
          # Run the test suite via composer script. The script handles output redirection.
          docker compose exec -T php sh -c 'composer ci-test'
      -
        name: Copy test artifacts
        if: ${{ always() }} # This step will always run
        run: |
          docker compose cp php:/app/coverage.xml ./coverage.xml
          docker compose cp php:/app/junit.xml ./junit.xml
          docker compose cp php:/app/var/phpunit-output.log ./phpunit-output.log
          docker compose cp php:/app/var/coverage ./coverage-html
      -
        name: Upload coverage to Codecov
        if: ${{ steps.phpunit.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
      -
        name: Format PHPUnit summary for PR comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          PHPUNIT_OUTCOME: ${{ steps.phpunit.outcome }}
        run: |
          PHPUNIT_LOG="phpunit-output.log"
          FORMATTED_OUTPUT="formatted_phpunit_summary.md"

          # Strip ANSI escape codes from log
          sed -i 's/\x1B\[[0-9;]*[mGKHF]//g' "$PHPUNIT_LOG"

          # Extract summary lines
          TEST_SUMMARY=$(grep -o 'Tests:.*' "$PHPUNIT_LOG" | head -n 1)
          TIME_SUMMARY=$(grep -o 'Time:.*, Memory:.*' "$PHPUNIT_LOG" | head -n 1)

          # Start building the comment body
          {
            if [ "$PHPUNIT_OUTCOME" = "success" ]; then
              echo "### :white_check_mark: PHPUnit Summary"
            else
              echo "### :x: PHPUnit Summary"
            fi
            echo ""
            if [ -n "$TEST_SUMMARY" ]; then
                echo "\`$TEST_SUMMARY\`"
            fi
            if [ -n "$TIME_SUMMARY" ]; then
                echo "\`$TIME_SUMMARY\`"
            fi
            echo ""
          } > "$FORMATTED_OUTPUT"


          # Grep for actual deprecation notices by looking for "is deprecated" pattern.
          # Use -B 1 to capture the line before (which contains file path and line number).
          # This catches all deprecation messages regardless of how they start.
          grep -B 1 -E 'is deprecated' "$PHPUNIT_LOG" | grep -v '^--$' > deprecations.log || true

          if [ -s "deprecations.log" ]; then
              # Count actual deprecation messages (lines with "is deprecated")
              DEPRECATION_COUNT=$(grep -c 'is deprecated' deprecations.log || echo 0)
              {
                echo "### :warning: PHPUnit Deprecations Found"
                echo ""
                echo "<details>"
                echo "<summary>Click to expand $DEPRECATION_COUNT deprecation notices</summary>"
                echo ""
                echo "\`\`\`"
                cat "deprecations.log"
                echo "\`\`\`"
                echo "</details>"
              } >> "$FORMATTED_OUTPUT"
          else
              {
                echo "### :white_check_mark: No PHPUnit Deprecations Found"
              } >> "$FORMATTED_OUTPUT"
          fi
      -
        name: Post PHPUnit summary as PR comment
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: phpunit-summary
          path: formatted_phpunit_summary.md
      -
        name: Fail job on test failure
        if: ${{ steps.phpunit.outcome == 'failure' }}
        run: |
          echo "PHPUnit tests failed."
          exit 1
      -
        name: Custom CSV Validator
        run: docker compose exec -T php bin/console -e test serializer:validate:csv
      -
        name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
        
  code-quality:
    needs: build
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      - name: Setup Docker Environment
        uses: ./.github/actions/setup-docker

      - name: Run Rector (dry-run)
        run: docker compose exec -T php ./vendor/bin/rector process --dry-run
      
      - name: Composer Dependency Analyser
        run: docker compose exec -T php ./vendor/bin/composer-dependency-analyser --config composer-dependency-analyser.php

