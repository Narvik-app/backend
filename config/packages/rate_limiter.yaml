framework:
    rate_limiter:
        # define 2 rate limiters (one for username+IP, the other for IP)
        user_ip_login:
            policy: token_bucket
            limit: 5
            rate: { interval: '5 minutes' }

        ip_login:
            policy: sliding_window
            limit: 50
            interval: '15 minutes'

        # /auth/bdg is PUBLIC_ACCESS and compares the club's badger token directly,
        # keyed on club+IP to throttle brute-forcing a given club's token
        badger_login:
            policy: token_bucket
            limit: 5
            rate: { interval: '5 minutes' }
