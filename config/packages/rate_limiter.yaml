framework:
    rate_limiter:
        # define 2 rate limiters (one for username+IP, the other for IP)
        user_ip_login:
            policy: token_bucket
            limit: 5
            rate: { interval: '5 minutes' }

        ip_login:
            policy: sliding_window
            limit: 50
            interval: '15 minutes'

        # Shared by /auth/bdg (club+IP key) and /auth/quick-login/bdg (IP key),
        # both PUBLIC_ACCESS and comparing a badger credential directly
        badger_login:
            policy: token_bucket
            limit: 5
            rate: { interval: '5 minutes' }

        ip_register:
            policy: token_bucket
            limit: 5
            rate: { interval: '5 minutes' }

# The e2e suite runs many requests from the same loopback IP, which would otherwise
# exhaust these bare-IP-keyed buckets after a handful of tests. Raise the limits high
# enough to be a no-op rather than disabling the limiters outright, so wiring mistakes
# still show up. badger_login is deliberately NOT overridden here:
# SecurityControllerTest::testRepeatedWrongBadgerTokensAreRateLimited relies on its real
# threshold, and it stays safe to test even shared across both endpoints, since both
# reset it on success and existing tests either do that or use an isolated fixture.
when@test:
    framework:
        rate_limiter:
            user_ip_login:
                policy: token_bucket
                limit: 10000
                rate: { interval: '5 minutes' }

            ip_login:
                policy: sliding_window
                limit: 10000
                interval: '15 minutes'

            ip_register:
                policy: token_bucket
                limit: 10000
                rate: { interval: '5 minutes' }
