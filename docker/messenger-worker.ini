[supervisorctl]

[supervisord]

[program:messenger-consume]
command=php /app/bin/console messenger:consume async_medium async_low --time-limit=3600 --limit=20
user=root
numprocs=1
startsecs=0
autostart=true
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d

[program:messenger-consume-high]
command=php /app/bin/console messenger:consume async_high --time-limit=3600 --limit=20
user=root
numprocs=1
startsecs=0
autostart=true
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d
